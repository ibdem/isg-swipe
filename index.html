<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İSG Swipe</title>
<style>
body{margin:0;background:#071d31;font-family:Arial;color:#17202a}.wrap{max-width:1100px;margin:auto;padding:15px}.panel,.main,.side,.result{background:#fff;border-radius:20px;padding:18px}.start{max-width:550px;margin:70px auto;text-align:center}.brand{font-size:28px;font-weight:900;color:#fff}.brand span{color:#f2bd21}.name{width:90%;padding:14px;margin:18px 0;border:2px solid #ddd;border-radius:10px;font-size:17px}.btn{padding:15px;border:0;border-radius:12px;color:#fff;font-weight:900;cursor:pointer}.startbtn{width:95%;background:#071d31}.top{display:grid;grid-template-columns:1fr 150px 120px;gap:10px;align-items:center;color:#fff}.box{background:#0a263d;border:1px solid #45617a;border-radius:12px;padding:10px;text-align:center}.timer{font-size:28px;font-weight:900;color:#f2bd21}.warn{color:#ff5c5c}.progress{height:8px;background:#29435a;border-radius:20px;margin:12px 0}.bar{height:100%;background:#f2bd21;width:0}.layout{display:grid;grid-template-columns:1fr 250px;gap:15px}.title{text-align:center;font-size:23px;font-weight:900}.visual img{width:100%;border-radius:14px}.scenario{font-size:16px;line-height:1.5;padding:12px 2px}.tip{background:#fff5d7;padding:10px;border-radius:10px;font-size:13px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.safe{background:#2f9e44}.risk{background:#d62828}.feedback{display:none;padding:12px;border-radius:10px;margin-top:10px}.ok{background:#e7f7eb}.bad{background:#fff0f0}.next{display:none;background:#071d31;width:100%;margin-top:10px}.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.qnum{padding:9px;border:1px solid #ccd4dc;border-radius:8px;text-align:center}.active{background:#2f9e44;color:#fff}.wrong{background:#d62828;color:#fff}.result{display:none;margin-top:15px}.wrongitem{border-left:5px solid #d62828;background:#fafafa;padding:12px;margin:10px 0}.final{text-align:center;font-size:52px;font-weight:900}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.top{grid-template-columns:1fr 120px}.top .box:nth-child(3){display:none}}
</style></head><body><div class="wrap">
<div id="start" class="panel start"><div class="brand">🦺 İSG <span>SWIPE</span></div><h1>Güvenli Çalış, Güvenli Dön</h1><p>Oyuna başlamadan önce adınızı ve soyadınızı giriniz.</p><input id="name" class="name" maxlength="80" placeholder="Ad Soyad"><br><button id="startBtn" class="btn startbtn">OYUNA BAŞLA →</button><p id="msg"></p></div>
<div id="gameArea" style="display:none"><div class="top"><div><div class="brand">🦺 İSG <span>SWIPE</span></div><small id="welcome"></small></div><div class="box"><div id="timer" class="timer">04:00</div><small>KALAN SÜRE</small></div><div class="box"><b id="counter">1 / 12</b><br><small>SORU</small></div></div><div class="progress"><div id="bar" class="bar"></div></div>
<div class="layout"><main class="main"><div class="title">BU DURUM GÜVENLİ Mİ, RİSKLİ Mİ?</div><div class="visual"><img id="img"></div><div id="scenario" class="scenario"></div><div class="tip"><b>İPUCU:</b> Kritik ayrıntıyı değerlendir.</div><div class="answers"><button id="safeBtn" class="btn safe">🛡️ GÜVENLİ</button><button id="riskBtn" class="btn risk">⚠️ RİSKLİ</button></div><div id="feedback" class="feedback"></div><button id="next" class="btn next">SONRAKİ SORU →</button></main>
<aside class="side"><h2>SKOR</h2><p>✅ Doğru: <b id="correct">0</b></p><p>❌ Yanlış: <b id="wrong">0</b></p><div id="qgrid" class="qgrid"></div></aside></div></div>
<section id="result" class="result"></section></div>
<script>
const SUPABASE_URL="https://utjnembjmwkqesxsyhqo.supabase.co",SUPABASE_KEY="sb_publishable_1_8qPR-Ccxe5csZ94DR9zg_ozVI73NP",questions=[{"id": 1, "topic": "Kaldırma Operasyonu – Bariyerleme", "text": "4 tonluk ekipman vinçle kaldırılıyor. Sapan ve vinç kontrolleri uygun; ancak yükün dönüş alanı tamamen bariyerlenmemiş ve çevredekiler yalnızca sözlü olarak uzaklaştırılıyor.", "answer": "risk", "explanation": "Kaldırma alanı fiziksel olarak sınırlandırılmalı ve yetkisiz kişilerin tehlikeli alana girişi engellenmelidir.", "image": "images/q1.svg"}, {"id": 2, "topic": "Sapan Kontrolü – Uygunluk", "text": "Yük kaldırılmadan önce sapanın etiketi, kapasitesi ve görünür durumu kontrol ediliyor. Sapanın kapasitesi yük için yeterli, deformasyon görülmüyor ve kaldırma alanı bariyerlenmiş.", "answer": "safe", "explanation": "Kapasite ve kimlik bilgileri kontrol edilmiş, görünür hasar bulunmuyor ve alan kontrol altına alınmış. Bu güvenli bir uygulamadır.", "image": "images/q2.svg"}, {"id": 3, "topic": "Yüksekte Çalışma – Korkuluk", "text": "Yaklaşık 5 m yükseklikte demontaj yapılıyor. Korkuluğun bir bölümü kaldırılmış; çalışan emniyet kemeri takıyor fakat düşüş mesafesi ve kurtarma yöntemi değerlendirilmemiş.", "answer": "risk", "explanation": "Toplu koruma kaldırılıyorsa düşüş önleme/durdurma sistemi, düşüş mesafesi ve kurtarma yöntemi birlikte değerlendirilmelidir.", "image": "images/q3.svg"}, {"id": 4, "topic": "LOTO – Doğrulama", "text": "Pompa bakımı öncesi enerji kaynağı kapatılıyor, yetkili çalışan kendi kilidini ve etiketini uyguluyor. Enerji izolasyonundan sonra ekipmanın enerjisiz olduğu uygun yöntemle doğrulanıyor.", "answer": "safe", "explanation": "Enerji izolasyonu, kişisel kilitleme/etiketleme ve enerjisizliğin doğrulanması birlikte uygulanmış. Bu güvenli bir LOTO uygulamasıdır.", "image": "images/q4.svg"}, {"id": 5, "topic": "Elektrik Panosu – Erişim", "text": "Elektrik panosu kapalı ve uyarı işaretleri mevcut; ancak pano önünde malzeme istiflenmiş ve güvenli erişim alanının önemli bölümü kapatılmış.", "answer": "risk", "explanation": "Uyarı etiketi tek başına yeterli değildir. Pano önündeki erişim ve çalışma alanı sürekli açık ve güvenli tutulmalıdır.", "image": "images/q5.svg"}, {"id": 6, "topic": "Sıcak Çalışma – Yanıcı Malzeme", "text": "Kapalı proses alanında kaynak yapılacak. Sıcak çalışma izni alınmış; ancak yakınındaki solvent kapları alandan uzaklaştırılmamış ve yangın gözcüsü görevlendirilmemiş.", "answer": "risk", "explanation": "Sıcak çalışma öncesi yanıcı malzemeler uzaklaştırılmalı ve gerekli yangın gözcüsü/önlemler sağlanmalıdır.", "image": "images/q6.svg"}, {"id": 7, "topic": "Paketleme – Sıkışma Müdahalesi", "text": "Paketleme makinesinin çıkışında poşet sıkışıyor. Çalışan makineyi durdurmadan elini uzatıp poşeti çekiyor.", "answer": "risk", "explanation": "Hareketli bölüme müdahale sıkışma ve ezilme riski oluşturur. Müdahale öncesi makine güvenli şekilde durdurulmalıdır.", "image": "images/q7.svg"}, {"id": 8, "topic": "Paketleme – Güvenli Müdahale", "text": "Paketleme makinesinde poşet sıkıştığında çalışan hattı durduruyor, hareketin tamamen sona ermesini bekliyor ve gerekli izolasyon prosedürünü uyguladıktan sonra müdahale ediyor.", "answer": "safe", "explanation": "Makine durdurulmuş, tehlikeli hareket sona erdirilmiş ve gerekli izolasyon uygulanmış. Güvenli müdahale yaklaşımı budur.", "image": "images/q8.svg"}, {"id": 9, "topic": "Paketleme – Koruyucu", "text": "Çalışanın uzanma mesafesini azaltmak için çıkışa biriktirme tablası ekleniyor. Ancak tabla hareketli bölüme çok yakın olduğu için elin tehlikeli bölgeye yaklaşması mümkün hale geliyor.", "answer": "risk", "explanation": "Ergonomik iyileştirme makine güvenliğini azaltmamalıdır. Erişim mesafeleri ve koruyucular yeniden değerlendirilmelidir.", "image": "images/q9.svg"}, {"id": 10, "topic": "Forklift – Güvenli Park", "text": "Forklift park edildiğinde çatallar yere indirilmiş, araç güvenli park konumuna alınmış, park freni uygulanmış ve araç kontrolsüz harekete karşı güvenli hale getirilmiş.", "answer": "safe", "explanation": "Forklift güvenli park pozisyonuna alınmış ve kontrolsüz hareket riski azaltılmış. Bu güvenli bir park uygulamasıdır.", "image": "images/q10.svg"}, {"id": 11, "topic": "Demontaj + Yaya Yolu", "text": "Paketleme hattının yanında demontaj yapılıyor. Alan şerit ile çevrili; ancak yaya yolu hemen yanından geçiyor ve sökülen parçalar yaya güzergâhının kenarında bekletiliyor.", "answer": "risk", "explanation": "Yaya trafiği ile bakım/demontaj faaliyeti arasındaki etkileşim kontrol altına alınmalı; parçalar yaya güzergâhında bekletilmemelidir.", "image": "images/q11.svg"}, {"id": 12, "topic": "Kimyasal Transfer – KKD", "text": "Kimyasal transferi yapılırken uygun eldiven, gözlük/yüz koruması ve gerekli koruyucu ekipman kullanılıyor. Kaplar etiketli, dökülme kiti hazır ve transfer alanı düzenli.", "answer": "safe", "explanation": "Kimyasalın özelliğine uygun KKD, etiketleme ve dökülmeye hazırlık sağlanmış. Bu güvenli çalışma koşuludur.", "image": "images/q12.svg"}];
let i=0,score=0,correct=0,wrong=[],answered=[],locked=false,timeLeft=240,participant="";
const $=id=>document.getElementById(id);
function grid(){$("qgrid").innerHTML=questions.map((q,n)=>`<div class="qnum" id="q${n}">${n+1}</div>`).join("")}
function render(){if(i>=12){finish(false);return}locked=false;let q=questions[i];$("counter").textContent=(i+1)+" / 12";$("bar").style.width=(i/12*100)+"%";document.querySelectorAll(".qnum").forEach((e,n)=>e.className="qnum "+(n===i?"active":(answered[n]==="wrong"?"wrong":(answered[n]?"done":""))));$("img").src=q.image;$("scenario").textContent=q.text;$("feedback").style.display="none";$("next").style.display="none"}
function answer(v){if(locked)return;locked=true;let q=questions[i],ok=v===q.answer;if(ok){score+=10;correct++;answered[i]="correct"}else{wrong.push(i);answered[i]="wrong"}$("correct").textContent=correct;$("wrong").textContent=wrong.length;let f=$("feedback");f.className="feedback "+(ok?"ok":"bad");f.style.display="block";f.innerHTML="<b>"+(ok?"✅ Doğru!":"❌ Yanlış!")+"</b><br>"+q.explanation;$("next").style.display="block"}
async function save(){try{await fetch(SUPABASE_URL+"/rest/v1/isg_katilimlar",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({kullanici_adi:participant,yanlis_soru_kimlikleri:wrong.map(n=>questions[n].id),toplam_sorular:12,cevaplanan_sorular:answered.length,puan:score})})}catch(e){console.log(e)}}
function finish(timeout){clearInterval(clock);$("gameArea").style.display="none";$("result").style.display="block";$("bar").style.width="100%";let items=wrong.length?wrong.map(n=>`<div class="wrongitem"><b>Soru ${questions[n].id} – ${questions[n].topic}</b><br><br>${questions[n].text}<br><br><b>Doğru cevap:</b> ${questions[n].answer==="risk"?"🔴 RİSKLİ":"🟢 GÜVENLİ"}<br><br><b>İSG açıklaması:</b> ${questions[n].explanation}</div>`).join(""):"<p>🎉 Yanlış yaptığınız soru bulunmuyor.</p>";$("result").innerHTML=`<h2 style="text-align:center">${timeout?"⏱️ Süre Doldu":"🎉 Oyun Tamamlandı"}</h2><div class="final">${score}/120</div><p style="text-align:center">👤 ${participant}<br>✅ ${correct} doğru &nbsp; ❌ ${wrong.length} yanlış</p><h2>❌ Yanlış Yaptığınız Sorular</h2>${items}`;save()}
function tick(){timeLeft--;let m=String(Math.floor(timeLeft/60)).padStart(2,"0"),s=String(timeLeft%60).padStart(2,"0");$("timer").textContent=m+":"+s;if(timeLeft<=30)$("timer").classList.add("warn");if(timeLeft<=0)finish(true)}
$("startBtn").onclick=()=>{participant=$("name").value.trim();if(participant.length<2){$("msg").textContent="Lütfen adınızı ve soyadınızı giriniz.";return}$("start").style.display="none";$("gameArea").style.display="block";$("welcome").textContent="Katılımcı: "+participant;grid();render();window.clock=setInterval(tick,1000)};
$("safeBtn").onclick=()=>answer("safe");$("riskBtn").onclick=()=>answer("risk");$("next").onclick=()=>{i++;render()};
</script></body></html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İSG Challenge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071d31;color:#17202a;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:15px}.panel{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.brand{font-weight:800;color:#f2bd21;font-size:20px}.brand span{color:#17202a}
h1,h2{margin:10px 0}.start,.result{max-width:700px;margin:60px auto;text-align:center}
input{padding:14px;border:1px solid #ccd4dc;border-radius:10px;font-size:16px;width:100%;margin:12px 0}
button{padding:13px 18px;border:0;border-radius:10px;background:#164a78;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:22px;color:#b42318;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.timer{font-size:24px;font-weight:800}.timer.warn{color:#b42318}
.progress{height:10px;background:#e7edf2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#164a78}
.qbox{margin-top:18px;border:1px solid #dfe5ea;border-radius:16px;padding:16px}.qimg{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#f7f9fb;margin-bottom:14px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.option{background:#f5f8fa;color:#17202a;border:2px solid #d8e0e7}.option:hover{border-color:#164a78}
.score{font-size:52px;font-weight:900;color:#164a78}@media(max-width:700px){.options{grid-template-columns:1fr}.qimg{max-height:220px}}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
<div class="brand">🦺 İSG <span>CHALLENGE</span></div>

<section id="start" class="start">
<h1>Güvenli Çalış, Güvenli Dön</h1>
<p>Oyuna başlamadan önce adınızı ve soyadınızı giriniz.</p>
<input id="name" maxlength="50" autocomplete="name" placeholder="Ad Soyad">
<div id="startMsg" class="msg"></div>
<button id="startBtn">OYUNA BAŞLA</button>
</section>

<section id="game" style="display:none">
<div class="top"><b id="counter">1 / 12</b><div class="timer" id="timer">04:00</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="qbox">
<img id="qimg" class="qimg" alt="İSG senaryosu">
<h2 id="qtext"></h2>
<div class="options">
<button class="option" id="riskBtn">⚠️ RİSKLİ</button>
<button class="option" id="safeBtn">✅ GÜVENLİ</button>
</div></div></section>

<section id="result" class="result" style="display:none">
<h1 id="resultTitle">Yarışma Tamamlandı</h1><div class="score" id="scoreText">0</div>
<p id="resultDetails"></p><p id="saveMsg"></p>
</section>
</div></div>

<script>
const SUPABASE_URL="https://pzmqqgeowcxpcrzktxhp.supabase.co";
const SUPABASE_KEY="sb_publishable_52okgtC6njTs-uv9lWtYVw_zhMKh18_";
const TABLE="isg_katilimlar", TOTAL_TIME=240;

const questions=[
{id:1,topic:"Makine Koruyucuları",text:"Bir makinenin hareketli ve sıkışma/ezilme riski bulunan bölümlerinde koruyucu bulunmaması nasıl değerlendirilmelidir?",answer:"risk",image:"q1.svg"},
{id:2,topic:"Forklift-Yaya Güvenliği",text:"Forklift ile yayaların aynı çalışma alanında bulunduğu yerde yaya yolu belirlenmiş ve forklift ile yaya trafiği ayrılmıştır. Bu uygulama nasıl değerlendirilmelidir?",answer:"safe",image:"q2.svg"},
{id:3,topic:"Elektrik Kablosu",text:"Dış izolasyonu zarar görmüş ve iletken kısmı açığa çıkmaya başlamış bir elektrik kablosunun kullanılması nasıl değerlendirilmelidir?",answer:"risk",image:"q3.svg"},
{id:4,topic:"Yangın Söndürücü",text:"Yangın söndürücünün önü açık, kolay ulaşılabilir ve üzerinde gerekli yönlendirme işareti bulunmaktadır. Bu durum nasıl değerlendirilmelidir?",answer:"safe",image:"q4.svg"},
{id:5,topic:"Paketleme Makinesi",text:"Çalışan, paketleme makinesinde sıkışan malzemeyi makine çalışırken elini tehlikeli bölgeye sokarak çıkarmaya çalışmaktadır. Bu durum nasıl değerlendirilmelidir?",answer:"risk",image:"q5.svg"},
{id:6,topic:"Merdiven Kullanımı",text:"Çalışan, uygun durumdaki merdiveni düz ve sağlam zeminde, üç noktadan temas sağlayarak kullanmaktadır. Bu uygulama nasıl değerlendirilmelidir?",answer:"safe",image:"q6.svg"},
{id:7,topic:"Sıcak Çalışma",text:"Kaynak yapılacak alanda yanıcı malzemeler uzaklaştırılmadan ve gerekli sıcak çalışma önlemleri alınmadan işe başlanmaktadır. Bu durum nasıl değerlendirilmelidir?",answer:"risk",image:"q7.svg"},
{id:8,topic:"Elle Taşıma",text:"Çalışan, yükü kaldırmadan önce yükün ağırlığını ve tutma noktalarını değerlendiriyor, uygun kaldırma tekniğini kullanıyor ve gerektiğinde yardım istiyor. Bu uygulama nasıl değerlendirilmelidir?",answer:"safe",image:"q8.svg"},
{id:9,topic:"Sapan Kullanımı",text:"Kaldırma işleminden önce aşınmış, lifleri zarar görmüş ve deformasyon bulunan bir sapanın kullanılmaya devam edilmesi nasıl değerlendirilmelidir?",answer:"risk",image:"q9.svg"},
{id:10,topic:"Kimyasal Çalışma",text:"Kimyasal madde ile çalışan personel, ürüne uygun eldiven ve gözlük kullanıyor ve çalışma alanında gerekli güvenlik bilgileri bulunuyor. Bu uygulama nasıl değerlendirilmelidir?",answer:"safe",image:"q10.svg"},
{id:11,topic:"Yaya Yolu",text:"Belirlenmiş yaya yolunun malzeme ve ekipmanlarla kapatılması ve çalışanların araç trafiğinin bulunduğu alandan yürümek zorunda kalması nasıl değerlendirilmelidir?",answer:"risk",image:"q11.svg"},
{id:12,topic:"LOTO / Enerji İzolasyonu",text:"Bakım öncesinde makinenin enerji kaynakları izole edilmeden ve enerjinin sıfırlandığı doğrulanmadan müdahaleye başlanmaktadır. Bu durum nasıl değerlendirilmelidir?",answer:"risk",image:"q12.svg"}
];

let i=0,correct=0,wrong=[],answered=0,participant="",timeLeft=TOTAL_TIME,timerId=null,locked=false,finished=false;
const $=id=>document.getElementById(id);

function render(){
 if(i>=questions.length){finish("Tamamlandı");return}
 const q=questions[i];$("counter").textContent=(i+1)+" / "+questions.length;
 $("bar").style.width=(i/questions.length*100)+"%";$("qtext").textContent=q.text;$("qimg").src=q.image;
 $("riskBtn").disabled=false;$("safeBtn").disabled=false;locked=false;
}
function tick(){
 timeLeft--;let m=String(Math.floor(timeLeft/60)).padStart(2,"0"),s=String(timeLeft%60).padStart(2,"0");
 $("timer").textContent=m+":"+s;$("timer").classList.toggle("warn",timeLeft<=30);
 if(timeLeft<=0)finish("Süre Doldu");
}
async function saveResult(status){
 const score=Math.round(correct/questions.length*100);
 const payload={kullanici_adi:participant,yanlis_soru_kimlikleri:wrong,toplam_sorular:questions.length,cevaplanan_sorular:answered,puan:score,durum:status};
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+TABLE,{method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
   body:JSON.stringify(payload)});
  if(!r.ok)throw new Error(await r.text());
  $("saveMsg").textContent="Sonucunuz başarıyla kaydedildi.";
 }catch(e){console.error(e);$("saveMsg").textContent="Sonuç gösterildi ancak kayıt sırasında hata oluştu."}
}
function finish(status){
 if(finished)return;finished=true;clearInterval(timerId);$("game").style.display="none";$("result").style.display="block";
 const score=Math.round(correct/questions.length*100);
 $("resultTitle").textContent=status==="Süre Doldu"?"Süre Doldu":"Yarışma Tamamlandı";
 $("scoreText").textContent=score+" PUAN";
 $("resultDetails").textContent=answered+" soru cevaplandı • "+correct+" doğru • "+wrong.length+" yanlış • "+(questions.length-answered)+" boş";
 saveResult(status);
}
function answer(value){
 if(locked||finished)return;locked=true;answered++;let q=questions[i];
 if(value===q.answer)correct++;else wrong.push(q.id);i++;
 if(i>=questions.length)finish("Tamamlandı");else render();
}
$("startBtn").onclick=()=>{
 const n=$("name").value.trim();if(n.length<2){$("startMsg").textContent="Lütfen adınızı ve soyadınızı giriniz.";return}
 participant=n;$("start").style.display="none";$("game").style.display="block";timeLeft=TOTAL_TIME;
 $("timer").textContent="04:00";timerId=setInterval(tick,1000);render();
};
$("riskBtn").onclick=()=>answer("risk");$("safeBtn").onclick=()=>answer("safe");
</script>
</body></html>

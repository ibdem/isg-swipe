<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İSG Swipe – Yönetici</title><style>
body{margin:0;background:#071d31;font-family:Arial;color:#17202a}.wrap{max-width:950px;margin:auto;padding:20px}.brand{color:#fff;font-size:28px;font-weight:900}.brand span{color:#f2bd21}.panel{background:#fff;border-radius:20px;padding:22px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:13px;border-radius:10px;border:1px solid #ccd4dc;font-size:15px}input{flex:1;min-width:230px}button{background:#071d31;color:#fff;font-weight:800;cursor:pointer}.item{border-left:5px solid #d62828;background:#fafafa;padding:16px;margin:12px 0;border-radius:10px;line-height:1.5}.muted{color:#64748b;font-size:13px}</style></head><body><div class="wrap"><div class="brand">🦺 İSG <span>SWIPE</span> — YÖNETİCİ</div>
<div class="panel" id="login"><h2>Yönetici Girişi</h2><p class="muted">Yetkili Supabase hesabıyla giriş yapın.</p><div class="row"><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn">Giriş Yap</button></div><p id="msg"></p></div>
<div class="panel" id="dash" style="display:none"><div class="row" style="justify-content:space-between"><h2>❌ Yanlış Yapılan Sorular</h2><div><button id="refresh">Yenile</button> <button id="logout">Çıkış</button></div></div><p class="muted">Kişi adı ve yüzde gösterilmez. Aynı soru kaç kez yanlış yapılırsa yapılsın bir kez listelenir.</p><div id="list"></div></div></div>
<script>
const URL="https://tqgtnolvhapscjoimmy.supabase.co",KEY="sb_publishable_Bngz21g7CdKJUFcdwPbosg_kRDKFiD2",questions=[{"id": 1, "topic": "Kaldırma Operasyonu", "text": "4 tonluk ekipman vinçle kaldırılıyor. Kapasite ve sapan kontrolleri uygun; ancak yükün dönüş alanı tamamen bariyerlenmemiş, çevredekiler yalnızca sözlü olarak uzaklaştırılıyor.", "answer": "risk", "explanation": "Kaldırma alanı fiziksel olarak sınırlandırılmalı ve yetkisiz kişilerin tehlikeli alana girişi engellenmelidir.", "image": "images/q1.svg"}, {"id": 2, "topic": "Sapan Kontrolü", "text": "Yükün ağırlığı ve vincin kapasitesi uygun. Ancak kullanılan sapanın kullanım öncesi kontrolü yapılmamış; daha önce sorunsuz kullanıldığı gerekçesiyle çalışmaya devam edilmek isteniyor.", "answer": "risk", "explanation": "Kaldırma ekipmanı kullanım öncesinde uygunluk ve görünür hasar açısından kontrol edilmelidir.", "image": "images/q2.svg"}, {"id": 3, "topic": "Yüksekte Çalışma", "text": "Yaklaşık 5 m yükseklikte demontaj yapılıyor. Korkuluğun bir bölümü parçayı çıkarmak için kaldırılacak. Çalışan emniyet kemeri takıyor fakat düşüş mesafesi ve kurtarma yöntemi değerlendirilmemiş.", "answer": "risk", "explanation": "Toplu koruma kaldırılıyorsa düşüş önleme/durdurma sistemi, düşüş mesafesi ve kurtarma yöntemi birlikte değerlendirilmelidir.", "image": "images/q3.svg"}, {"id": 4, "topic": "LOTO / Enerji İzolasyonu", "text": "Pompa bakımı öncesi şalter kapatılıyor ve etiket asılıyor; ancak şalter kilitlenmiyor ve ekipmanın gerçekten enerjisiz olduğu test edilmiyor.", "answer": "risk", "explanation": "Enerjiyi kesmek tek başına yeterli değildir. Kilitleme/etiketleme ve izolasyonun doğrulanması gerekir.", "image": "images/q4.svg"}, {"id": 5, "topic": "Elektrik Panosu", "text": "Elektrik panosu kapalı ve uyarı işaretleri mevcut. Ancak pano önünde malzeme istiflenmiş ve erişim/çalışma alanının önemli bölümü kapatılmış.", "answer": "risk", "explanation": "Uyarı etiketi, panonun önündeki güvenli erişim ve çalışma alanının kapatılmasını güvenli hale getirmez.", "image": "images/q5.svg"}, {"id": 6, "topic": "Sıcak Çalışma / SIMOPS", "text": "Kapalı proses alanında kaynak yapılacak. İzin ve yangın tüpü hazır; ancak aynı alanda başka bir ekip solvent bazlı temizlik yapıyor ve eş zamanlı işlerin ortak risk değerlendirmesi yapılmamış.", "answer": "risk", "explanation": "Solvent buharları ile sıcak çalışma arasındaki etkileşim değerlendirilmeden işe başlanmamalıdır.", "image": "images/q6.svg"}, {"id": 7, "topic": "Paketleme – Sıkışma", "text": "Paketleme makinesinin çıkışında poşet sıkışıyor. Çalışan makineyi durdurmadan elini uzatıp poşeti çekiyor.", "answer": "risk", "explanation": "Hareketli bölüme müdahale sıkışma ve ezilme riski oluşturur. Müdahale öncesi makine güvenli şekilde durdurulmalıdır.", "image": "images/q7.svg"}, {"id": 8, "topic": "Paketleme – Koruyucu Kapak", "text": "Makinenin çıkışında anormal ses duyuluyor. Çalışan, makine çalışırken koruyucu kapağı açıp kontrol etmek istiyor; acil stop butonunun yakında olmasını yeterli görüyor.", "answer": "risk", "explanation": "Acil stop butonu, çalışan makinenin hareketli bölümlerine erişimi güvenli hale getirmez. Uygun durdurma ve gerekiyorsa enerji izolasyonu gerekir.", "image": "images/q8.svg"}, {"id": 9, "topic": "Paketleme – Ergonomi / Makine", "text": "Çalışanın uzanma mesafesini azaltmak için çıkışa biriktirme tablası ekleniyor. Ancak tabla hareketli bölüme çok yakın olduğu için elin tehlikeli bölgeye yaklaşması mümkün hale geliyor.", "answer": "risk", "explanation": "Ergonomik iyileştirme, makine güvenliğini azaltıyorsa uygun değildir; erişim mesafeleri ve koruyucular yeniden değerlendirilmelidir.", "image": "images/q9.svg"}, {"id": 10, "topic": "Forklift – Güvenli Park", "text": "Forklift park halinde ve çatalları aşağıda. Operatör kısa süreliğine ayrılıyor ancak motoru çalışır bırakıyor.", "answer": "risk", "explanation": "Operatör ayrılırken güvenli park prosedürü uygulanmalı ve araç kontrolsüz hareket/erişim risklerine karşı güvenli hale getirilmelidir.", "image": "images/q10.svg"}, {"id": 11, "topic": "Demontaj + Yaya Yolu", "text": "Paketleme hattının yanında demontaj yapılıyor. Alan şerit ile çevrili; ancak yaya yolu hemen yanından geçiyor ve sökülen parçalar zaman zaman yaya güzergâhının kenarında bekletiliyor.", "answer": "risk", "explanation": "Yaya trafiği ile bakım/demontaj faaliyeti arasındaki etkileşim kontrol altına alınmalı; parçalar yaya güzergâhında bekletilmemelidir.", "image": "images/q11.svg"}, {"id": 12, "topic": "Güvenli Makine Çalışması", "text": "Paketleme hattının koruyucuları yerinde ve sağlam. Çalışan hareketli bölümlere erişemiyor, geçiş yolu açık ve arıza/sıkışma müdahalesi yetkili bakım personeline bırakılıyor.", "answer": "safe", "explanation": "Koruyucular ve güvenli erişim düzeni korunuyor; çalışan hareketli bölümlere erişemiyor ve arıza müdahalesi yetkili personele bırakılıyor.", "image": "images/q12.svg"}];let token=null;
async function loginAdmin(){let email=document.getElementById("email").value,password=document.getElementById("password").value;let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok){document.getElementById("msg").textContent="Giriş başarısız. E-posta/şifreyi kontrol edin.";return}token=d.access_token;document.getElementById("login").style.display="none";document.getElementById("dash").style.display="block";loadResults()}
async function loadResults(){let r=await fetch(URL+"/rest/v1/game_results?select=wrong_question_ids&limit=1000",{headers:{apikey:KEY,Authorization:"Bearer "+token}});let rows=await r.json();if(!r.ok){list.innerHTML="<p>Sonuçlar okunamadı. RLS ayarını kontrol edin.</p>";return}let ids=[...new Set(rows.flatMap(x=>x.wrong_question_ids||[]))].sort((a,b)=>a-b);list.innerHTML=ids.length?ids.map(id=>{let x=questions.find(q=>q.id===id);return `<div class="item"><b>Soru ${x.id} – ${x.topic}</b><br><br>${x.text}<br><br><b>Doğru cevap:</b> ${x.answer==="risk"?"🔴 RİSKLİ":"🟢 GÜVENLİ"}<br><br><b>İSG açıklaması:</b> ${x.explanation}</div>`}).join(""):"<p>Henüz yanlış yapılan soru yok.</p>"}
document.getElementById("loginBtn").onclick=loginAdmin;document.getElementById("refresh").onclick=loadResults;document.getElementById("logout").onclick=()=>location.reload();
</script></body></html>

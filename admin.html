
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İSG Challenge - Yönetici</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071d31;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:20px}.panel{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.12)}.brand{font-weight:800;color:#f2bd21;font-size:20px}.brand span{color:#17202a}h1,h2{margin:8px 0 16px}.login{max-width:520px;margin:70px auto}.input{width:100%;padding:13px;border:1px solid #ccd4dc;border-radius:9px;margin:8px 0;font-size:16px}button{padding:11px 16px;border:0;border-radius:9px;background:#164a78;color:#fff;font-weight:700;cursor:pointer}button.danger{background:#b42318}button.secondary{background:#64748b}button:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:24px;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{padding:8px 12px;border-radius:999px;font-weight:800;background:#e7edf2}.ready{background:#dcfce7}.started{background:#fee2e2}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#f5f7f9}.muted{color:#64748b}.empty{text-align:center;padding:25px}.logout{float:right}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
<div class="brand">🦺 İSG <span>CHALLENGE</span></div>
</div>

<section id="loginPanel" class="panel login">
<h1>Yönetici Girişi</h1>
<input id="email" class="input" type="email" placeholder="E-posta">
<input id="password" class="input" type="password" placeholder="Şifre">
<div class="actions"><button id="loginBtn">GİRİŞ YAP</button><button id="forgotBtn" class="secondary">ŞİFREMİ UNUTTUM</button></div>
<div id="loginMsg" class="msg"></div>
</section>

<section id="adminPanel" style="display:none">
<div class="panel">
<div class="top"><div><h1>Yarışma Kontrolü</h1><div class="muted">Katılımcılar beklerken burada görünür.</div></div><div id="raceStatus" class="status">Yükleniyor...</div></div>
<div class="actions">
<button id="startRaceBtn">YARIŞMAYI BAŞLAT</button>
<button id="resetRaceBtn" class="secondary">YENİ YARIŞMA / SIFIRLA</button>
<button id="logoutBtn" class="danger logout">ÇIKIŞ</button>
</div>
<div id="raceMsg" class="msg"></div>
</div>

<div class="panel">
<h2>Bekleyen Katılımcılar (<span id="readyCount">0</span>)</h2>
<div class="tablewrap"><table><thead><tr><th>Katılımcı</th><th>Katılım zamanı</th></tr></thead><tbody id="readyBody"></tbody></table></div>
</div>

<div class="panel">
<h2>Sonuçlar</h2>
<div class="tablewrap"><table><thead><tr><th>Katılımcı</th><th>Durum</th><th>Puan</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Tarih</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
</div>
</section>
</div>

<script>
const SUPABASE_URL="https://pzmqqgeowcxpcrzktxhp.supabase.co";
const SUPABASE_KEY="sb_publishable_52okgtC6njTs-uv9lWtYVw_zhMKh18_";
const RESULTS_TABLE="isg_katilimlar",WAIT_TABLE="isg_bekleyenler",RACE_TABLE="isg_yarisma";
let accessToken="",refreshId=null;

function authHeaders(){return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken}}
async function api(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{...options,headers:{...authHeaders(),...(options.headers||{})}});
 if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json();
}
async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 document.getElementById("loginMsg").textContent="";
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  if(!r.ok)throw new Error(await r.text());
  const data=await r.json();accessToken=data.access_token;
  document.getElementById("loginPanel").style.display="none";document.getElementById("adminPanel").style.display="block";
  await loadAll();refreshId=setInterval(loadAll,2000);
 }catch(e){document.getElementById("loginMsg").textContent="Giriş başarısız. E-posta veya şifreyi kontrol edin.";console.error(e)}
}
async function loadAll(){
 try{await loadRace();await loadReady();await loadResults()}catch(e){console.error(e)}
}
async function loadRace(){
 const rows=await api("/rest/v1/"+RACE_TABLE+"?id=eq.1&select=id,durum,baslangic_zamani,updated_at");
 const s=document.getElementById("raceStatus");
 if(!rows.length){s.textContent="Durum bulunamadı";return}
 const race=rows[0];s.textContent=race.durum==="basladi"?"YARIŞMA BAŞLADI":"BEKLİYOR";
 s.className="status "+(race.durum==="basladi"?"started":"ready");
 document.getElementById("startRaceBtn").disabled=race.durum==="basladi";
}
async function loadReady(){
 const rows=await api("/rest/v1/"+WAIT_TABLE+"?select=id,kullanici_adi,katilim_zamani&order=katilim_zamani.asc");
 document.getElementById("readyCount").textContent=rows.length;
 const body=document.getElementById("readyBody");body.innerHTML="";
 if(!rows.length){body.innerHTML='<tr><td colspan="2" class="empty muted">Henüz katılımcı yok.</td></tr>';return}
 rows.forEach(x=>{const tr=document.createElement("tr");tr.innerHTML="<td>"+esc(x.kullanici_adi)+"</td><td>"+new Date(x.katilim_zamani).toLocaleString("tr-TR")+"</td>";body.appendChild(tr)})
}
async function loadResults(){
 const rows=await api("/rest/v1/"+RESULTS_TABLE+"?select=*&order=created_at.desc");
 const body=document.getElementById("resultsBody");body.innerHTML="";
 if(!rows.length){body.innerHTML='<tr><td colspan="7" class="empty muted">Henüz sonuç yok.</td></tr>';return}
 rows.forEach(x=>{
  const unanswered=(x.toplam_sorular||12)-(x.cevaplanan_sorular||0);
  const wrong=(x.yanlis_soru_kimlikleri||[]).length;
  const correct=(x.cevaplanan_sorular||0)-wrong;
  const tr=document.createElement("tr");
  tr.innerHTML="<td>"+esc(x.kullanici_adi)+"</td><td>"+esc(x.durum||"Tamamlandı")+"</td><td>"+(x.puan??0)+"</td><td>"+correct+"</td><td>"+wrong+"</td><td>"+unanswered+"</td><td>"+new Date(x.created_at).toLocaleString("tr-TR")+"</td>";
  body.appendChild(tr);
 })
}
async function startRace(){
 const rows=await api("/rest/v1/"+WAIT_TABLE+"?select=id");
 if(!rows.length){document.getElementById("raceMsg").textContent="Başlatmak için en az bir katılımcı bekliyor olmalı.";return}
 const startAt=new Date(Date.now()+4000).toISOString();
 try{
  await api("/rest/v1/"+RACE_TABLE+"?id=eq.1",{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({durum:"basladi",baslangic_zamani:startAt,updated_at:new Date().toISOString()})});
  document.getElementById("raceMsg").textContent="Yarışma başlatıldı. Katılımcılar 3-2-1 ile başlayacak.";
  await loadRace();
 }catch(e){document.getElementById("raceMsg").textContent="Yarışma başlatılamadı.";console.error(e)}
}
async function resetRace(){
 if(!confirm("Yeni yarışma başlatmak için bekleme listesini temizlemek istediğinize emin misiniz?"))return;
 try{
  await api("/rest/v1/"+WAIT_TABLE,{method:"DELETE"});
  await api("/rest/v1/"+RACE_TABLE+"?id=eq.1",{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({durum:"bekliyor",baslangic_zamani:null,updated_at:new Date().toISOString()})});
  document.getElementById("raceMsg").textContent="Yeni yarışma için sistem hazır.";
  await loadAll();
 }catch(e){document.getElementById("raceMsg").textContent="Sıfırlama başarısız.";console.error(e)}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function forgot(){
 const email=document.getElementById("email").value.trim();
 if(!email){document.getElementById("loginMsg").textContent="Önce e-posta adresinizi yazın.";return}
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/recover",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email})});
  if(!r.ok)throw new Error(await r.text());document.getElementById("loginMsg").textContent="Şifre sıfırlama e-postası gönderildi.";
 }catch(e){document.getElementById("loginMsg").textContent="Şifre sıfırlama isteği gönderilemedi.";console.error(e)}
}
function logout(){accessToken="";clearInterval(refreshId);document.getElementById("adminPanel").style.display="none";document.getElementById("loginPanel").style.display="block"}
document.getElementById("loginBtn").onclick=login;document.getElementById("forgotBtn").onclick=forgot;document.getElementById("startRaceBtn").onclick=startRace;document.getElementById("resetRaceBtn").onclick=resetRace;document.getElementById("logoutBtn").onclick=logout;
</script>
</body></html>

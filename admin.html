<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İSG Swipe – Yönetici Paneli</title>
<style>
body{margin:0;background:#071d31;font-family:Arial,sans-serif;color:#17202a}.wrap{max-width:1150px;margin:auto;padding:20px}.brand{color:#fff;font-size:28px;font-weight:900}.brand span{color:#f2bd21}.panel{background:#fff;border-radius:20px;padding:22px;margin:15px 0;box-shadow:0 4px 18px #0002}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{padding:13px;border-radius:10px;border:1px solid #ccd4dc;font-size:15px}input{flex:1;min-width:220px}button{background:#071d31;color:#fff;font-weight:900;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{text-align:center;border:1px solid #dce2e7;border-radius:14px;padding:16px}.card b{display:block;font-size:30px;margin-bottom:5px}.muted{color:#64748b;font-size:13px}.person{background:#f8fafb;border-left:5px solid #173b58;padding:14px;margin:10px 0;border-radius:10px}.wrongitem{background:#fffafa;border-left:5px solid #d62828;padding:16px;margin:12px 0;border-radius:10px;line-height:1.5}.wrongcount{display:inline-block;background:#d62828;color:white;border-radius:20px;padding:4px 10px;font-weight:900;margin-left:6px}.answer{font-weight:900}.safe{color:#2f9e44}.risk{color:#d62828}.search{max-width:350px}.hidden{display:none}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div class="wrap">
<div class="brand">🦺 İSG <span>SWIPE</span> — YÖNETİCİ PANELİ</div>
<div id="login" class="panel"><h2>Yönetici Girişi</h2><div class="row"><input id="email" type="email" placeholder="Yönetici e-postası"><input id="password" type="password" placeholder="Şifre"><button id="loginBtn">Giriş Yap</button></div><p id="loginMsg"></p></div>
<div id="dashboard" class="hidden">
<div class="panel"><div class="row"><h2 style="flex:1">📊 Genel Sonuçlar</h2><button id="refresh">Yenile</button><button id="clearAll" style="background:#d62828">🧹 Tüm Test Kayıtlarını Temizle</button><button id="logout">Çıkış</button></div>
<div class="cards"><div class="card"><b id="total">0</b>TOPLAM KATILIM</div><div class="card"><b id="completed">0</b>TAMAMLAYAN</div><div class="card"><b id="avg">0</b>ORTALAMA PUAN</div><div class="card"><b id="best">0</b>EN YÜKSEK PUAN</div></div></div>
<div class="panel"><div class="row"><h2 style="flex:1">👥 Katılımcılar</h2><input id="search" class="search" placeholder="Katılımcı ara..."></div><div id="people"></div></div>
<div class="panel"><h2>❌ En Çok Yanlış Yapılan Sorular</h2><p class="muted">Bu bölüm, tüm katılımcıların yanlış cevaplarını birleştirir. Sorular tam metin olarak gösterilir.</p><div id="wrongList"></div></div>
</div></div>
<script>
const URL="https://utjnembjmwkqesxsyhqo.supabase.co",KEY="sb_publishable_1_8qPR-Ccxe5csZ94DR9zg_ozVI73NP",QUESTIONS=[{"id": 1, "topic": "Kaldırma Operasyonu – Bariyerleme", "text": "4 tonluk ekipman vinçle kaldırılıyor. Sapan ve vinç kontrolleri uygun; ancak yükün dönüş alanı tamamen bariyerlenmemiş ve çevredekiler yalnızca sözlü olarak uzaklaştırılıyor.", "answer": "risk", "explanation": "Kaldırma alanı fiziksel olarak sınırlandırılmalı ve yetkisiz kişilerin tehlikeli alana girişi engellenmelidir."}, {"id": 2, "topic": "Sapan Kontrolü – Uygunluk", "text": "Yük kaldırılmadan önce sapanın etiketi, kapasitesi ve görünür durumu kontrol ediliyor. Sapanın kapasitesi yük için yeterli, deformasyon görülmüyor ve kaldırma alanı bariyerlenmiş.", "answer": "safe", "explanation": "Kapasite ve kimlik bilgileri kontrol edilmiş, görünür hasar bulunmuyor ve alan kontrol altına alınmış. Bu güvenli bir uygulamadır."}, {"id": 3, "topic": "Yüksekte Çalışma – Korkuluk", "text": "Yaklaşık 5 m yükseklikte demontaj yapılıyor. Korkuluğun bir bölümü kaldırılmış; çalışan emniyet kemeri takıyor fakat düşüş mesafesi ve kurtarma yöntemi değerlendirilmemiş.", "answer": "risk", "explanation": "Toplu koruma kaldırılıyorsa düşüş önleme/durdurma sistemi, düşüş mesafesi ve kurtarma yöntemi birlikte değerlendirilmelidir."}, {"id": 4, "topic": "LOTO – Doğrulama", "text": "Pompa bakımı öncesi enerji kaynağı kapatılıyor, yetkili çalışan kendi kilidini ve etiketini uyguluyor. Enerji izolasyonundan sonra ekipmanın enerjisiz olduğu uygun yöntemle doğrulanıyor.", "answer": "safe", "explanation": "Enerji izolasyonu, kişisel kilitleme/etiketleme ve enerjisizliğin doğrulanması birlikte uygulanmış. Bu güvenli bir LOTO uygulamasıdır."}, {"id": 5, "topic": "Elektrik Panosu – Erişim", "text": "Elektrik panosu kapalı ve uyarı işaretleri mevcut; ancak pano önünde malzeme istiflenmiş ve güvenli erişim alanının önemli bölümü kapatılmış.", "answer": "risk", "explanation": "Uyarı etiketi tek başına yeterli değildir. Pano önündeki erişim ve çalışma alanı sürekli açık ve güvenli tutulmalıdır."}, {"id": 6, "topic": "Sıcak Çalışma – Yanıcı Malzeme", "text": "Kapalı proses alanında kaynak yapılacak. Sıcak çalışma izni alınmış; ancak yakınındaki solvent kapları alandan uzaklaştırılmamış ve yangın gözcüsü görevlendirilmemiş.", "answer": "risk", "explanation": "Sıcak çalışma öncesi yanıcı malzemeler uzaklaştırılmalı ve gerekli yangın gözcüsü/önlemler sağlanmalıdır."}, {"id": 7, "topic": "Paketleme – Sıkışma Müdahalesi", "text": "Paketleme makinesinin çıkışında poşet sıkışıyor. Çalışan makineyi durdurmadan elini uzatıp poşeti çekiyor.", "answer": "risk", "explanation": "Hareketli bölüme müdahale sıkışma ve ezilme riski oluşturur. Müdahale öncesi makine güvenli şekilde durdurulmalıdır."}, {"id": 8, "topic": "Paketleme – Güvenli Müdahale", "text": "Paketleme makinesinde poşet sıkıştığında çalışan hattı durduruyor, hareketin tamamen sona ermesini bekliyor ve gerekli izolasyon prosedürünü uyguladıktan sonra müdahale ediyor.", "answer": "safe", "explanation": "Makine durdurulmuş, tehlikeli hareket sona erdirilmiş ve gerekli izolasyon uygulanmış. Güvenli müdahale yaklaşımı budur."}, {"id": 9, "topic": "Paketleme – Koruyucu", "text": "Çalışanın uzanma mesafesini azaltmak için çıkışa biriktirme tablası ekleniyor. Ancak tabla hareketli bölüme çok yakın olduğu için elin tehlikeli bölgeye yaklaşması mümkün hale geliyor.", "answer": "risk", "explanation": "Ergonomik iyileştirme makine güvenliğini azaltmamalıdır. Erişim mesafeleri ve koruyucular yeniden değerlendirilmelidir."}, {"id": 10, "topic": "Forklift – Güvenli Park", "text": "Forklift park edildiğinde çatallar yere indirilmiş, araç güvenli park konumuna alınmış, park freni uygulanmış ve araç kontrolsüz harekete karşı güvenli hale getirilmiş.", "answer": "safe", "explanation": "Forklift güvenli park pozisyonuna alınmış ve kontrolsüz hareket riski azaltılmış. Bu güvenli bir park uygulamasıdır."}, {"id": 11, "topic": "Demontaj + Yaya Yolu", "text": "Paketleme hattının yanında demontaj yapılıyor. Alan şerit ile çevrili; ancak yaya yolu hemen yanından geçiyor ve sökülen parçalar yaya güzergâhının kenarında bekletiliyor.", "answer": "risk", "explanation": "Yaya trafiği ile bakım/demontaj faaliyeti arasındaki etkileşim kontrol altına alınmalı; parçalar yaya güzergâhında bekletilmemelidir."}, {"id": 12, "topic": "Kimyasal Transfer – KKD", "text": "Kimyasal transferi yapılırken uygun eldiven, gözlük/yüz koruması ve gerekli koruyucu ekipman kullanılıyor. Kaplar etiketli, dökülme kiti hazır ve transfer alanı düzenli.", "answer": "safe", "explanation": "Kimyasalın özelliğine uygun KKD, etiketleme ve dökülmeye hazırlık sağlanmış. Bu güvenli çalışma koşuludur."}];
let token=null,rows=[];
const $=id=>document.getElementById(id);
async function login(){
  let email=$("email").value.trim(),password=$("password").value;
  let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  let d=await r.json();
  if(!r.ok){$("loginMsg").textContent="Giriş başarısız. E-posta veya şifreyi kontrol edin.";return}
  token=d.access_token;$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");load();
}
async function load(){
  let r=await fetch(URL+"/rest/v1/isg_katilimlar?select=*&order=created_at.desc&limit=1000",{headers:{apikey:KEY,Authorization:"Bearer "+token}});
  rows=await r.json();
  if(!r.ok){$("people").textContent="Sonuçlar okunamadı.";return}
  $("total").textContent=rows.length;
  $("completed").textContent=rows.filter(x=>x.cevaplanan_sorular===12).length;
  $("avg").textContent=rows.length?Math.round(rows.reduce((a,x)=>a+(x.puan||0),0)/rows.length):0;
  $("best").textContent=rows.length?Math.max(...rows.map(x=>x.puan||0)):0;
  renderPeople();
  renderWrong();
}
function renderPeople(){
  let term=$("search").value.trim().toLocaleLowerCase("tr-TR");
  let list=rows.filter(x=>(x.kullanici_adi||"").toLocaleLowerCase("tr-TR").includes(term));
  $("people").innerHTML=list.length?list.map(x=>{
    let w=(x.yanlis_soru_kimlikleri||[]).length, c=x.cevaplanan_sorular-w;
    return `<div class="person"><div class="row"><div style="flex:1"><b>${esc(x.kullanici_adi)}</b><br><span class="muted">${new Date(x.created_at).toLocaleString("tr-TR")}</span><br>🎯 <b>${x.puan}/120</b> &nbsp; ✅ ${c} doğru &nbsp; ❌ ${w} yanlış &nbsp; ${x.cevaplanan_sorular===12?"✅ Tamamladı":"⏱️ Tamamlanmadı"}</div><button onclick="deleteOne(${x.id})" style="background:#d62828">🗑️ Sil</button></div></div>`
  }).join(""):"<p>Katılımcı bulunamadı.</p>";
}
function renderWrong(){
  let counts={};
  rows.forEach(r=>(r.yanlis_soru_kimlikleri||[]).forEach(id=>counts[id]=(counts[id]||0)+1));
  let ids=Object.keys(counts).map(Number).sort((a,b)=>counts[b]-counts[a]||a-b);
  $("wrongList").innerHTML=ids.length?ids.map(id=>{
    let q=QUESTIONS.find(x=>x.id===id);
    return `<div class="wrongitem"><div><b>Soru ${q.id} – ${esc(q.topic)}</b><span class="wrongcount">${counts[id]} kişi yanlış yaptı</span></div><p>${esc(q.text)}</p><p><b>Doğru cevap:</b> <span class="answer ${q.answer==="risk"?"risk":"safe"}">${q.answer==="risk"?"🔴 RİSKLİ":"🟢 GÜVENLİ"}</span></p><p><b>İSG açıklaması:</b> ${esc(q.explanation)}</p></div>`
  }).join(""):"<p>Henüz yanlış yapılan soru yok.</p>";
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function deleteOne(id){
  if(!confirm("Bu katılımcının test sonucunu silmek istediğinize emin misiniz?")) return;
  let r=await fetch(URL+"/rest/v1/isg_katilimlar?id=eq."+encodeURIComponent(id),{
    method:"DELETE",
    headers:{apikey:KEY,Authorization:"Bearer "+token}
  });
  if(!r.ok){alert("Kayıt silinemedi. Supabase DELETE yetkisini kontrol edin.");return}
  await load();
}
async function clearAll(){
  if(!rows.length){alert("Silinecek kayıt bulunmuyor.");return}
  if(!confirm("TÜM test sonuçları silinecek. Bu işlem geri alınamaz. Devam etmek istiyor musunuz?")) return;
  if(!confirm("Son kez soruyorum: Tüm katılımcı sonuçlarını temizleyelim mi?")) return;
  let r=await fetch(URL+"/rest/v1/isg_katilimlar?id=not.is.null",{
    method:"DELETE",
    headers:{apikey:KEY,Authorization:"Bearer "+token}
  });
  if(!r.ok){alert("Kayıtlar silinemedi. Supabase DELETE yetkisini eklememiz gerekiyor.");return}
  await load();
  alert("Test kayıtları temizlendi.");
}
$("loginBtn").onclick=login;
$("refresh").onclick=load;
$("clearAll").onclick=clearAll;
$("logout").onclick=()=>location.reload();
$("search").oninput=renderPeople;
</script></body></html>

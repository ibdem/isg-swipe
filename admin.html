<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İSG Swipe Yönetici</title>
<style>body{margin:0;background:#071d31;font-family:Arial;color:#17202a}.wrap{max-width:1050px;margin:auto;padding:20px}.brand{color:#fff;font-size:28px;font-weight:900}.brand span{color:#f2bd21}.panel{background:#fff;border-radius:20px;padding:20px;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:13px;border-radius:10px;border:1px solid #ccd4dc;font-size:15px}input{flex:1}button{background:#071d31;color:#fff;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{text-align:center;border:1px solid #ddd;border-radius:12px;padding:15px}.card b{font-size:30px}.person{background:#fafafa;border-left:5px solid #173b58;padding:13px;margin:10px 0;border-radius:9px}.wrongitem{background:#fafafa;border-left:5px solid #d62828;padding:13px;margin:10px 0;border-radius:9px;line-height:1.5}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">🦺 İSG <span>SWIPE</span> — YÖNETİCİ</div>
<div id="login" class="panel"><h2>Yönetici Girişi</h2><div class="row"><input id="email" type="email" placeholder="E-posta"><input id="pass" type="password" placeholder="Şifre"><button id="loginBtn">Giriş Yap</button></div><p id="msg"></p></div>
<div id="dash" class="panel" style="display:none"><div class="row"><h2 style="flex:1">Katılımcılar</h2><button id="refresh">Yenile</button><button id="logout">Çıkış</button></div><div class="cards"><div class="card"><b id="total">0</b><br>TOPLAM KATILIM</div><div class="card"><b id="avg">0</b><br>ORTALAMA PUAN</div><div class="card"><b id="completed">0</b><br>TAMAMLAYAN</div></div><h2>👥 Kimler Katıldı?</h2><div id="people"></div><h2>❌ Yanlış Yapılan Sorular</h2><p>Aynı soru birden fazla kişi tarafından yanlış yapılsa da burada bir kez gösterilir.</p><div id="wrongList"></div></div></div>
<script>const URL="https://utjnembjmwkqesxsyhqo.supabase.co",KEY="sb_publishable_1_8qPR-Ccxe5csZ94DR9zg_ozVI73NP",questions=[{"id": 1, "topic": "Kaldırma Operasyonu – Bariyerleme", "text": "4 tonluk ekipman vinçle kaldırılıyor. Sapan ve vinç kontrolleri uygun; ancak yükün dönüş alanı tamamen bariyerlenmemiş ve çevredekiler yalnızca sözlü olarak uzaklaştırılıyor.", "answer": "risk", "explanation": "Kaldırma alanı fiziksel olarak sınırlandırılmalı ve yetkisiz kişilerin tehlikeli alana girişi engellenmelidir.", "image": "images/q1.svg"}, {"id": 2, "topic": "Sapan Kontrolü – Uygunluk", "text": "Yük kaldırılmadan önce sapanın etiketi, kapasitesi ve görünür durumu kontrol ediliyor. Sapanın kapasitesi yük için yeterli, deformasyon görülmüyor ve kaldırma alanı bariyerlenmiş.", "answer": "safe", "explanation": "Kapasite ve kimlik bilgileri kontrol edilmiş, görünür hasar bulunmuyor ve alan kontrol altına alınmış. Bu güvenli bir uygulamadır.", "image": "images/q2.svg"}, {"id": 3, "topic": "Yüksekte Çalışma – Korkuluk", "text": "Yaklaşık 5 m yükseklikte demontaj yapılıyor. Korkuluğun bir bölümü kaldırılmış; çalışan emniyet kemeri takıyor fakat düşüş mesafesi ve kurtarma yöntemi değerlendirilmemiş.", "answer": "risk", "explanation": "Toplu koruma kaldırılıyorsa düşüş önleme/durdurma sistemi, düşüş mesafesi ve kurtarma yöntemi birlikte değerlendirilmelidir.", "image": "images/q3.svg"}, {"id": 4, "topic": "LOTO – Doğrulama", "text": "Pompa bakımı öncesi enerji kaynağı kapatılıyor, yetkili çalışan kendi kilidini ve etiketini uyguluyor. Enerji izolasyonundan sonra ekipmanın enerjisiz olduğu uygun yöntemle doğrulanıyor.", "answer": "safe", "explanation": "Enerji izolasyonu, kişisel kilitleme/etiketleme ve enerjisizliğin doğrulanması birlikte uygulanmış. Bu güvenli bir LOTO uygulamasıdır.", "image": "images/q4.svg"}, {"id": 5, "topic": "Elektrik Panosu – Erişim", "text": "Elektrik panosu kapalı ve uyarı işaretleri mevcut; ancak pano önünde malzeme istiflenmiş ve güvenli erişim alanının önemli bölümü kapatılmış.", "answer": "risk", "explanation": "Uyarı etiketi tek başına yeterli değildir. Pano önündeki erişim ve çalışma alanı sürekli açık ve güvenli tutulmalıdır.", "image": "images/q5.svg"}, {"id": 6, "topic": "Sıcak Çalışma – Yanıcı Malzeme", "text": "Kapalı proses alanında kaynak yapılacak. Sıcak çalışma izni alınmış; ancak yakınındaki solvent kapları alandan uzaklaştırılmamış ve yangın gözcüsü görevlendirilmemiş.", "answer": "risk", "explanation": "Sıcak çalışma öncesi yanıcı malzemeler uzaklaştırılmalı ve gerekli yangın gözcüsü/önlemler sağlanmalıdır.", "image": "images/q6.svg"}, {"id": 7, "topic": "Paketleme – Sıkışma Müdahalesi", "text": "Paketleme makinesinin çıkışında poşet sıkışıyor. Çalışan makineyi durdurmadan elini uzatıp poşeti çekiyor.", "answer": "risk", "explanation": "Hareketli bölüme müdahale sıkışma ve ezilme riski oluşturur. Müdahale öncesi makine güvenli şekilde durdurulmalıdır.", "image": "images/q7.svg"}, {"id": 8, "topic": "Paketleme – Güvenli Müdahale", "text": "Paketleme makinesinde poşet sıkıştığında çalışan hattı durduruyor, hareketin tamamen sona ermesini bekliyor ve gerekli izolasyon prosedürünü uyguladıktan sonra müdahale ediyor.", "answer": "safe", "explanation": "Makine durdurulmuş, tehlikeli hareket sona erdirilmiş ve gerekli izolasyon uygulanmış. Güvenli müdahale yaklaşımı budur.", "image": "images/q8.svg"}, {"id": 9, "topic": "Paketleme – Koruyucu", "text": "Çalışanın uzanma mesafesini azaltmak için çıkışa biriktirme tablası ekleniyor. Ancak tabla hareketli bölüme çok yakın olduğu için elin tehlikeli bölgeye yaklaşması mümkün hale geliyor.", "answer": "risk", "explanation": "Ergonomik iyileştirme makine güvenliğini azaltmamalıdır. Erişim mesafeleri ve koruyucular yeniden değerlendirilmelidir.", "image": "images/q9.svg"}, {"id": 10, "topic": "Forklift – Güvenli Park", "text": "Forklift park edildiğinde çatallar yere indirilmiş, araç güvenli park konumuna alınmış, park freni uygulanmış ve araç kontrolsüz harekete karşı güvenli hale getirilmiş.", "answer": "safe", "explanation": "Forklift güvenli park pozisyonuna alınmış ve kontrolsüz hareket riski azaltılmış. Bu güvenli bir park uygulamasıdır.", "image": "images/q10.svg"}, {"id": 11, "topic": "Demontaj + Yaya Yolu", "text": "Paketleme hattının yanında demontaj yapılıyor. Alan şerit ile çevrili; ancak yaya yolu hemen yanından geçiyor ve sökülen parçalar yaya güzergâhının kenarında bekletiliyor.", "answer": "risk", "explanation": "Yaya trafiği ile bakım/demontaj faaliyeti arasındaki etkileşim kontrol altına alınmalı; parçalar yaya güzergâhında bekletilmemelidir.", "image": "images/q11.svg"}, {"id": 12, "topic": "Kimyasal Transfer – KKD", "text": "Kimyasal transferi yapılırken uygun eldiven, gözlük/yüz koruması ve gerekli koruyucu ekipman kullanılıyor. Kaplar etiketli, dökülme kiti hazır ve transfer alanı düzenli.", "answer": "safe", "explanation": "Kimyasalın özelliğine uygun KKD, etiketleme ve dökülmeye hazırlık sağlanmış. Bu güvenli çalışma koşuludur.", "image": "images/q12.svg"}];let token=null;
async function login(){let email=$("email").value,password=$("pass").value,r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok){$("msg").textContent="Giriş başarısız.";return}token=d.access_token;$("login").style.display="none";$("dash").style.display="block";load()}
async function load(){let r=await fetch(URL+"/rest/v1/isg_katilimlar?select=*&order=created_at.desc&limit=1000",{headers:{apikey:KEY,Authorization:"Bearer "+token}}),rows=await r.json();if(!r.ok){$("people").textContent="Sonuçlar okunamadı.";return}$("total").textContent=rows.length;$("completed").textContent=rows.filter(x=>x.cevaplanan_sorular===12).length;$("avg").textContent=rows.length?Math.round(rows.reduce((a,x)=>a+x.puan,0)/rows.length):0;$("people").innerHTML=rows.length?rows.map(x=>`<div class="person"><b>${x.kullanici_adi}</b><br>${new Date(x.created_at).toLocaleString("tr-TR")}<br>🎯 ${x.puan}/120 &nbsp; ❌ ${(x.yanlis_soru_kimlikleri||[]).length} yanlış</div>`).join(""):"<p>Henüz katılım yok.</p>";let ids=[...new Set(rows.flatMap(x=>x.yanlis_soru_kimlikleri||[]))].sort((a,b)=>a-b);$("wrongList").innerHTML=ids.length?ids.map(id=>{let q=questions.find(x=>x.id===id);return `<div class="wrongitem"><b>Soru ${q.id} – ${q.topic}</b><br><br>${q.text}<br><br><b>Doğru cevap:</b> ${q.answer==="risk"?"🔴 RİSKLİ":"🟢 GÜVENLİ"}<br><br><b>Açıklama:</b> ${q.explanation}</div>`}).join(""):"<p>Henüz yanlış yapılan soru yok.</p>"}
const $=id=>document.getElementById(id);$("loginBtn").onclick=login;$("refresh").onclick=load;$("logout").onclick=()=>location.reload();</script></body></html>
